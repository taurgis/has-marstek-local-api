    command: ["python", "-m", "mock_device", "--ip", "172.28.0.26", "--device", "VenusC", "--ver", "153", "--ble-mac", "02deadbeef06", "--wifi-mac", "02cafebabe06", "--soc", "48"]

  # Mock device 7 - Venus A with PV, custom UDP port 30004
  # Firmware 150 / app label 150.9 (issue #57): solar 0.01 kWh, PV1 still
  # deciwatts, SYS + UPS. Keep 148 and 149 mocks; do not collapse them here.
  mock-marstek-7:
    <<: *default-logging
