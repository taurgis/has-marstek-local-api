services:
  homeassistant:
    # Current stable Core as of 2026-09-18. Recreate after bumping:
    #   docker compose pull homeassistant && docker compose up -d homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: marstek-ha-dev
    privileged: true
    environment:
      - GIT_EDITOR=code --wait
      - WORKSPACE_DIRECTORY=/workspaces/ha_marstek
    volumes:
      - ..:/workspaces/ha_marstek:cached
      - ha_config:/config
      - ../custom_components:/config/custom_components:cached
    ports:
      - "8123:8123"
    networks:
      marstek_net:
        ipv4_address: 172.28.0.10
    command: python -m homeassistant -c /config

  # Mock device 1 - Venus E 3.0, default UDP port 30000
  # Legacy firmware 145: no SYS/UPS; energy fields in Wh
  mock-marstek:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device
    environment:
      - MOCK_IP=172.28.0.20
    networks:
      marstek_net:
        ipv4_address: 172.28.0.20
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.20", "--ver", "145", "--soc", "50"]

  # Mock device 2 - Venus E 3.0, default UDP port 30000
  # Firmware 150 Rev 3.1: SYS + UPS + EM energy; GetMode CT keys are zeros
  # (matches LAN capture of a real Venus E 3.0 / ver 150)
  mock-marstek-2:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-2
    environment:
      - MOCK_IP=172.28.0.25
    networks:
      marstek_net:
        ipv4_address: 172.28.0.25
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.25", "--device", "VenusE 3.0", "--ver", "150", "--ble-mac", "02deadbeef02", "--wifi-mac", "02cafebabe02", "--soc", "52"]

  # Mock device 3 - Venus A with PV (4 MPPT channels), custom UDP port 30001
  # Firmware 148 or older: solar energy in Wh, channel-1 deciwatt PV; no SYS/UPS
  # (issue #57 / integration 1.1.0 must keep the 1.0.0 PV1 ÷10)
  mock-marstek-3:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-3
    environment:
      - MOCK_IP=172.28.0.22
    networks:
      marstek_net:
        ipv4_address: 172.28.0.22
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.22", "--port", "30001", "--device", "VenusA", "--ver", "148", "--ble-mac", "02deadbeef03", "--wifi-mac", "02cafebabe03", "--soc", "30", "--pv-channels", "320:42:7.6,280:40:7.0,240:38:6.3,180:36:5.0"]

  # Mock device 4 - Venus D with PV (4 MPPT channels), custom UDP port 30002
  # Legacy firmware 145: channel-1 deciwatt PV encoding, solar energy in Wh; no SYS/UPS
  mock-marstek-4:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-4
    environment:
      - MOCK_IP=172.28.0.23
    networks:
      marstek_net:
        ipv4_address: 172.28.0.23
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.23", "--port", "30002", "--device", "VenusD", "--ver", "145", "--ble-mac", "02deadbeef04", "--wifi-mac", "02cafebabe04", "--soc", "60", "--pv-channels", "320:42:7.6,280:40:7.0,240:38:6.3,180:36:5.0"]

  # Mock device 5 - Venus A with PV (4 MPPT channels), custom UDP port 30003
  # Firmware 149: solar energy as 0.01 kWh (issue #35), channel-1 still deciwatts;
  # no SYS/UPS. Pair with mock-marstek-3 (Venus A 148) for both energy encodings.
  mock-marstek-5:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-5
    environment:
      - MOCK_IP=172.28.0.24
    networks:
      marstek_net:
        ipv4_address: 172.28.0.24
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.24", "--port", "30003", "--device", "VenusA", "--ver", "149", "--ble-mac", "02deadbeef05", "--wifi-mac", "02cafebabe05", "--soc", "65", "--pv-channels", "360:44:8.2,300:41:7.3,260:39:6.7,200:37:5.4"]

  # Mock device 6 - Venus C, default UDP port 30000
  # Firmware 153 (issue #60): SYS + UPS; no PV. Same-port-reply firmware on the
  # default Open API port, sharing 30000 with the Venus E mocks.
  mock-marstek-6:
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-6
    environment:
      - MOCK_IP=172.28.0.26
    networks:
      marstek_net:
        ipv4_address: 172.28.0.26
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.26", "--device", "VenusC", "--ver", "153", "--ble-mac", "02deadbeef06", "--wifi-mac", "02cafebabe06", "--soc", "48"]

networks:
  marstek_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ha_config:
    name: marstek-ha-config
