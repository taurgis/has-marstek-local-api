# Container logs are unbounded by default (json-file max-size defaults to -1),
# so one misbehaving device can fill the disk. Cap and rotate every service.
# Applies only to containers created after this change:
#   docker compose up -d --force-recreate
# https://docs.docker.com/engine/logging/drivers/json-file/
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

# Firmware emulator (tools/firmware_emulator/Dockerfile): one image for every
# Venus E 3.0 / A / D service below. The build downloads a pinned,
# checksum-verified Renode; set MARSTEK_BUILD_CA to a CA bundle file when a
# TLS-intercepting proxy sits in the way.
x-firmware-emulator: &firmware-emulator
  <<: *default-logging
  build:
    context: ..
    dockerfile: tools/firmware_emulator/Dockerfile
    secrets:
      - build_ca
  image: marstek-fw-emulator:local
  init: true
  stop_grace_period: 20s

# AstraMeter as the CT003 of one emulator, sharing its network namespace.
# 2.3.1 is the release current on 2026-09-29, pinned by digest.
# It starts once the emulator is healthy (can_peers.py serves the meter by then)
# and retries, since it exits when its first meter read fails.
x-firmware-ct: &firmware-ct
  <<: *default-logging
  restart: on-failure
  image: ghcr.io/tomquist/astrameter:2.3.1@sha256:72329da6a63704fb68be7668c494640639c9b28cfbf3bae7588ac1f13a36fb0e
  volumes:
    - ../tools/firmware_emulator/astrameter/config.ini:/app/config.ini:ro

services:
  homeassistant:
    <<: *default-logging
    # Current stable Core as of 2026-09-18. Recreate after bumping:
    #   docker compose pull homeassistant && docker compose up -d homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: marstek-ha-dev
    privileged: true
    environment:
      - GIT_EDITOR=code --wait
      - WORKSPACE_DIRECTORY=/workspaces/ha_marstek
    volumes:
      - ..:/workspaces/ha_marstek:cached
      - ha_config:/config
      - ../custom_components:/config/custom_components:cached
    ports:
      - "8123:8123"
    networks:
      marstek_net:
        ipv4_address: 172.28.0.10
    command: python -m homeassistant -c /config

  # Mock device 1 - Venus E 3.0, default UDP port 30000
  # Legacy firmware 145: no SYS/UPS; energy fields in Wh
  mock-marstek:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device
    environment:
      - MOCK_IP=172.28.0.20
    networks:
      marstek_net:
        ipv4_address: 172.28.0.20
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.20", "--ver", "145", "--soc", "50"]

  # Mock device 2 - Venus E 3.0, default UDP port 30000
  # Firmware 150 Rev 3.1: SYS + UPS + EM energy; GetMode CT keys are zeros
