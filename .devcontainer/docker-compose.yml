  # ---- Firmware emulators: the vendor's own Control firmware in Renode ----
  # tools/firmware_emulator/README.md ("Docker"). Each emulator reports its own
  # IP and answers the Local API on UDP 30000; healthy = Marstek.GetDevice
  # answers. Its AstraMeter CT003 sidecar shares the emulator's network namespace
  # and gets the firmware's port-12345 CT polls over loopback (--ct-loopback), so
  # no other device's meter answers them. The EEPROM (the firmware's settings)
  # persists in a named volume per device.
  # Three run by default; every other catalogued Venus E 3.0 / A / D image is in
  # the firmware-all profile:  docker compose --profile firmware-all up -d
  # Profile images run a slower emulated MCU (--mips 40) to fit 16 on few cores.
  # Venus E 3.0, Control 150 (current release)
  fw-venus-e-150:
    <<: *firmware-emulator
    container_name: marstek-fw-venus-e-150
    hostname: fw-venus-e-150
    networks:
      marstek_net:
        ipv4_address: 172.28.0.50
    volumes:
      - fw_venus_e_150:/state
    command: ["--firmware", "VNSE3-0:150", "--ble-mac", "02:e0:00:00:00:50", "--wifi-mac", "02:e1:00:00:00:50", "--soc", "55"]

  fw-venus-e-150-ct:
    <<: *firmware-ct
    container_name: marstek-fw-venus-e-150-ct
    network_mode: service:fw-venus-e-150
    depends_on:
      fw-venus-e-150:
        condition: service_healthy

  # Venus A, Control 150, two PV channels
  fw-venus-a-150:
    <<: *firmware-emulator
    container_name: marstek-fw-venus-a-150
    hostname: fw-venus-a-150
    networks:
      marstek_net:
        ipv4_address: 172.28.0.51
    volumes:
      - fw_venus_a_150:/state
    command: ["--firmware", "VNSA-0:150", "--ble-mac", "02:e0:00:00:00:51", "--wifi-mac", "02:e1:00:00:00:51", "--soc", "40", "--pv", "420,360"]

  fw-venus-a-150-ct:
    <<: *firmware-ct
    container_name: marstek-fw-venus-a-150-ct
    network_mode: service:fw-venus-a-150
    depends_on:
      fw-venus-a-150:
        condition: service_healthy

  # Venus D, Control 150, four PV channels
  fw-venus-d-150:
    <<: *firmware-emulator
    container_name: marstek-fw-venus-d-150
