        ipv4_address: 172.28.0.27
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.27", "--port", "30004", "--device", "VenusA", "--ver", "150", "--ble-mac", "02deadbeef07", "--wifi-mac", "02cafebabe07", "--soc", "70", "--pv-channels", "400:45:8.8,310:42:7.4,250:40:6.2,190:38:5.0"]

  # Mock device 8 - Venus E mini, default UDP port 30000
  # Known integer ver below 150: SYS without the 150 gate, no UPS, slots 0–5.
  # Distinct from Venus E 145 (no SYS) and Venus E 150 (UPS + ten slots).
  mock-marstek-8:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-8
    environment:
      - MOCK_IP=172.28.0.28
    networks:
      marstek_net:
        ipv4_address: 172.28.0.28
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.28", "--device", "Venus E mini", "--ver", "145", "--ble-mac", "02deadbeef08", "--wifi-mac", "02cafebabe08", "--soc", "55"]

  # Mock device 9 - Venus E 2.0 / HMG-50, default UDP port 30000
  # Control 153 is the first HMG-50 image with Marstek.GetDevice. The
  # firmware reports device "VenusE" (src VenusE-%s), not "VenusE 3.0".
  # The integration must reject it (CT003 disconnect), not add it as E 3.x.
  mock-marstek-9:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-9
    environment:
      - MOCK_IP=172.28.0.29
    networks:
      marstek_net:
        ipv4_address: 172.28.0.29
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.29", "--device", "VenusE", "--ver", "153", "--ble-mac", "02deadbeef09", "--wifi-mac", "02cafebabe09", "--soc", "40"]

  # Remaining archived Control versions (see tools/firmware/catalog.json).
  # Existing .20–.29 stay as the issue-log / custom-port set.

  # VNSE3-0 Control 144 (oldest archived Venus E 3.0 Open API image)
  mock-marstek-10:
    <<: *default-logging
    build:
      context: ..
