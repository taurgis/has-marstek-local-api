    command: ["python", "-m", "mock_device", "--ip", "172.28.0.30", "--device", "VenusE 3.0", "--ver", "144", "--ble-mac", "02deadbeef0a", "--wifi-mac", "02cafebabe0a", "--soc", "44"]

  mock-marstek-11:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-11
    environment:
      - MOCK_IP=172.28.0.31
    networks:
      marstek_net:
        ipv4_address: 172.28.0.31
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.31", "--device", "VenusE 3.0", "--ver", "147", "--ble-mac", "02deadbeef0b", "--wifi-mac", "02cafebabe0b", "--soc", "47"]

  mock-marstek-12:
