# Container logs are unbounded by default (json-file max-size defaults to -1),
# so one misbehaving device can fill the disk. Cap and rotate every service.
# Applies only to containers created after this change:
#   docker compose up -d --force-recreate
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  homeassistant:
    <<: *default-logging
    # Current stable Core as of 2026-09-18. Recreate after bumping:
    #   docker compose pull homeassistant && docker compose up -d homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.3
    container_name: marstek-ha-dev
    privileged: true
    environment:
      - GIT_EDITOR=code --wait
      - WORKSPACE_DIRECTORY=/workspaces/ha_marstek
    volumes:
      - ..:/workspaces/ha_marstek:cached
      - ha_config:/config
      - ../custom_components:/config/custom_components:cached
    ports:
      - "8123:8123"
    networks:
      marstek_net:
        ipv4_address: 172.28.0.10
    command: python -m homeassistant -c /config

  # Mock device 1 - Venus E 3.0, default UDP port 30000
  # Legacy firmware 145: no SYS/UPS; energy fields in Wh
  mock-marstek:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device
    environment:
      - MOCK_IP=172.28.0.20
    networks:
      marstek_net:
        ipv4_address: 172.28.0.20
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.20", "--ver", "145", "--soc", "50"]

  # Mock device 2 - Venus E 3.0, default UDP port 30000
  # Firmware 150 Rev 3.1: SYS + UPS + EM energy; GetMode CT keys are zeros
  # (matches LAN capture of a real Venus E 3.0 / ver 150)
  mock-marstek-2:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-2
    environment:
      - MOCK_IP=172.28.0.25
    networks:
      marstek_net:
        ipv4_address: 172.28.0.25
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.25", "--device", "VenusE 3.0", "--ver", "150", "--ble-mac", "02deadbeef02", "--wifi-mac", "02cafebabe02", "--soc", "52"]

  # Mock device 3 - Venus A with PV (4 MPPT channels), custom UDP port 30001
  # Firmware 148 or older: solar energy in Wh, channel-1 deciwatt PV; no SYS/UPS
  # (issue #57 / integration 1.1.0 must keep the 1.0.0 PV1 ÷10)
  mock-marstek-3:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-3
    environment:
      - MOCK_IP=172.28.0.22
    networks:
      marstek_net:
        ipv4_address: 172.28.0.22
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.22", "--port", "30001", "--device", "VenusA", "--ver", "148", "--ble-mac", "02deadbeef03", "--wifi-mac", "02cafebabe03", "--soc", "30", "--pv-channels", "320:42:7.6,280:40:7.0,240:38:6.3,180:36:5.0"]

  # Mock device 4 - Venus D with PV (4 MPPT channels), custom UDP port 30002
  # Legacy firmware 145: channel-1 deciwatt PV encoding, solar energy in Wh; no SYS/UPS
  mock-marstek-4:
    <<: *default-logging
    build:
      context: ..
      dockerfile: tools/mock_device/Dockerfile
    container_name: marstek-mock-device-4
