      - MOCK_IP=172.28.0.23
    networks:
      marstek_net:
        ipv4_address: 172.28.0.23
    command: ["python", "-m", "mock_device", "--ip", "172.28.0.23", "--port", "30002", "--device", "VenusD", "--ver", "145", "--ble-mac", "02deadbeef04", "--wifi-mac", "02cafebabe04", "--soc", "60", "--pv-channels", "320:42:7.6,280:40:7.0,240:38:6.3,180:36:5.0"]

  # Mock device 5 - Venus A with PV (4 MPPT channels), custom UDP port 30003
  # Firmware 149: solar energy as 0.01 kWh (issue #35), channel-1 still deciwatts;
  # no SYS/UPS. Pair with mock-marstek-3 (Venus A 148) for both energy encodings.
  mock-marstek-5:
