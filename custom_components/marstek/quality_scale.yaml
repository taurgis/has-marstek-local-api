rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Integration does not emit events
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Single coordinator per device; entities read from coordinator.data
  reauthentication-flow:
    status: exempt
    comment: Integration uses UDP with no authentication; reauth flow handles IP changes only
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: done
    comment: _async_handle_discovery_with_unique_id updates config entry IP when device is rediscovered via scanner or DHCP
  discovery:
    status: done
    comment: Devices are discoverable via DHCP and integration discovery confirmation flow
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  dynamic-devices:
    status: exempt
    comment: Integration represents single device per config entry; users add multiple devices via separate config entries
  entity-category:
    status: done
    comment: Diagnostic sensors (WiFi RSSI, CT connection, battery capacity) use EntityCategory.DIAGNOSTIC
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >
      Diagnostic sensors (device info, WiFi RSSI, CT connection) disabled by
      default. Battery detail entities (temperature, remaining/rated capacity,
      charge/discharge permission) also disabled by default because their
      Bat.GetStatus source call is suspected to reset devices (issue #14);
      the coordinator skips the call while all of them are disabled.
  entity-translations:
    status: done
    comment: All entities use translation_key for proper localization
  exception-translations:
    status: done
    comment: All exceptions use translation_domain, translation_key, and translation_placeholders
  icon-translations:
    status: done
    comment: Created icons.json with icons for all sensor and select entities
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Integration uses UDP, not HTTP
  strict-typing: done

  # Best Practices (additional notes)
  # - Services registered idempotently in async_setup() with guard check
  # - EntityDescriptions used for sensors and binary_sensors
  # - suggested_display_precision set for numeric sensors (power=0, voltage=1, current=2, temp=1)
  # - Cleanup via entry.async_on_unload() for update listeners
  # - Shared UDP client pattern avoids port conflicts between multiple devices
