rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      home-assistant/brands serves Core's integration catalogue. A HACS-only
      custom integration has no entry there; the repository carries its own
      logo instead.
  common-modules:
    status: done
    comment: >-
      Coordinator in coordinator.py, shared entity wiring in entity.py
      (MarstekEntity, plus MarstekSysEntity for the write-only SYS platforms).
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: >-
      No third-party runtime dependencies. The Open API client is vendored at
      custom_components/marstek/pymarstek and manifest.json requirements is
      empty, so there is no PyPI package to hold to the rule.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: done
    comment: README "Removing the integration" covers per-entry deletion, HACS/manual uninstall, and what happens to the device's own OPEN API setting.
  entity-event-setup:
    status: exempt
    comment: Integration does not emit events
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: >-
      Every platform sets the constant explicitly: 0 on the coordinator-driven
      read-only platforms, 1 on the write platforms, because the device answers
      one UDP request at a time.
  reauthentication-flow:
    status: exempt
    comment: Integration uses UDP with no authentication; reauth flow handles IP changes only
  test-coverage:
    status: done
    comment: CI fails below 95% (--cov-fail-under=95).

  # Gold
  devices:
    status: done
    comment: >-
      DeviceInfo carries identifiers, the Wi-Fi/Bluetooth MAC connections,
      manufacturer, model, serial number and firmware version, so the device
      matches what DHCP and router integrations see.
  diagnostics: done
  discovery-update-info:
    status: done
    comment: _async_handle_discovery_with_unique_id updates config entry IP when device is rediscovered via scanner or DHCP
  discovery:
    status: done
    comment: Devices are discoverable via DHCP and integration discovery confirmation flow
  docs-data-update: done
  docs-examples:
    status: done
    comment: >-
      docs/services.md carries copy-paste automation YAML for every action,
      with screenshots of the visual editor. No blueprints are published yet;
      the Core rule's blueprint repository is not open to custom integrations.
  docs-known-limitations:
    status: done
    comment: README "Known limitations" covers the protocol constraints, the write-only SYS settings, and the per-firmware capability gaps.
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases:
    status: done
    comment: README "Use cases" covers tariff arbitrage, closed-loop power control, solar self-consumption, peak avoidance and monitoring.
  dynamic-devices:
    status: exempt
    comment: Integration represents single device per config entry; users add multiple devices via separate config entries
  entity-category:
    status: done
    comment: Diagnostic sensors use EntityCategory.DIAGNOSTIC; SYS DOD/BLE/LED writes use EntityCategory.CONFIG
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >
      Diagnostic sensors (device info, WiFi RSSI, CT connection) disabled by
      default. Battery detail entities (temperature, remaining/rated capacity,
      charge/discharge permission) also disabled by default because their
      Bat.GetStatus source call is suspected to reset devices (issue #14);
      the coordinator skips the call while all of them are disabled.
  entity-translations:
    status: done
    comment: All entities use translation_key for proper localization
  exception-translations:
    status: done
    comment: All exceptions use translation_domain, translation_key, and translation_placeholders
  icon-translations:
    status: done
    comment: >-
      icons.json covers every sensor, binary_sensor, select, number and switch
      translation key that does not already inherit an icon from its device
      class, plus one per action.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      async_remove_entry drops the device when its last entry goes away, and
      async_remove_config_entry_device lets a user delete a device the entry no
      longer represents (for example after a mainboard swap changes the MAC).

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Integration uses UDP, not HTTP
  strict-typing: done

  # Best Practices (additional notes)
  # - Services registered idempotently in async_setup() with guard check
  # - EntityDescriptions used for sensors and binary_sensors
  # - suggested_display_precision set for numeric sensors (power=0, voltage=1, current=2, temp=1)
  # - Cleanup via entry.async_on_unload() for update listeners
  # - Shared UDP client pattern avoids port conflicts between multiple devices
