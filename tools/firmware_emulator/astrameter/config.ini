# AstraMeter (https://github.com/tomquist/AstraMeter) as the emulated CT003.
# The reading comes from can_peers.py, so it follows the emulated inverter.
[GENERAL]
DEVICE_TYPE = ct003
SKIP_POWERMETER_TEST = False

[CT003]
WIFI_RSSI = -50
# Relay raw meter values; the firmware runs its own Auto loop.
ACTIVE_CONTROL = false

[JSON_HTTP]
URL = http://127.0.0.1:8099/
JSON_PATHS = $.a, $.b, $.c
THROTTLE_INTERVAL = 1
